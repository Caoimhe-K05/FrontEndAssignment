<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button></ion-back-button>
    </ion-buttons>

    <ion-title>Plugin Page!</ion-title><!--title-->
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <h2>In this page I will have a Native/Capacitor Plugin</h2>
  <br>
  <h2>Go to Genshin Impact Character Page!</h2>
  <ul>
    <li (click)="openBrowser()">Characters Page</li><!--sends user to browser-->
  </ul>
  <br>
  <h2>Get Location</h2>
  <ul>
    <li (click)="getLocation()">Get Location</li><!--gets users current location-->
  </ul>
  <h4>This is your location in Coordinates:</h4><!--prints outs user details using data binding-->
  <p>Latitude: {{lat}}</p><!--prints the latitude-->
  <p>Longitude: {{long}}</p><!--prints the longitude-->
</ion-content>

<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button></ion-back-button>
    </ion-buttons>

    <ion-title>Plugin Page!</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <h2>In this page I will have a Native/Capacitor Plugin</h2>
  <br>
  <h2>Go to Genshin Impact Character Page!</h2>
  <ion-button (click)="openBrowser()">Characters Page</ion-button><!--button will send the user to the genshin character website-->
  <br>
  <h2>Get Location</h2>
  <ion-button (click)="getLocation()">Get Location</ion-button><!--this calls the getlocation method-->
  <h4>This is your location in Coordinates:</h4><!--prints outs user details using data binding-->
  <p>Latitude: {{lat}}</p><!--prints the latitude-->
  <p>Longitude: {{long}}</p><!--prints the longitude-->
</ion-content>

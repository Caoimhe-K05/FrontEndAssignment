<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button></ion-back-button>
      <ion-title>Set Status</ion-title><!--title-->
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>


<ul><!--wrapped in ul for styling-->
  <ion-list>
    <ion-radio-group [(ngModel)]="status"><!--radio group with two way data binding-->
      <ion-item>
        <ion-label>Red</ion-label><!--label dispalying colour-->
        <ion-radio slot="end" value="Red"></ion-radio><!--the button is at the end and it saves the value-->
      </ion-item>
      <ion-item>
        <ion-label>Orange</ion-label>
        <ion-radio slot="end" value="Orange"></ion-radio>
      </ion-item>
      <ion-item>
        <ion-label>Yellow</ion-label>
        <ion-radio slot="end" value="Yellow"></ion-radio>
      </ion-item>
      <ion-item>
        <ion-label>Green</ion-label>
        <ion-radio slot="end" value="Green"></ion-radio>
      </ion-item>
      <ion-item>
        <ion-label>Blue</ion-label>
        <ion-radio slot="end" value="Blue"></ion-radio>
      </ion-item>
      <ion-item>
        <ion-label>Purple</ion-label>
        <ion-radio slot="end" value="Purple"></ion-radio>
      </ion-item>
      <ion-item>
        <ion-label>Pink</ion-label>
        <ion-radio slot="end" value="Pink"></ion-radio>
      </ion-item>
      
    </ion-radio-group>
  </ion-list>
</ul>
  <!--<ion-button (click)="onButtonClick()">SAVE</ion-button>-->
  <!--replaces all buttons as styling wouldnt work the way i wanted it to-->
  <ul>
    <li (click)="onButtonClick()">Save</li><!--calls the on button click method-->
  </ul>

  </ion-content>
